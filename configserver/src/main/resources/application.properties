spring.application.name=configserver
server.port=8888

spring.cloud.config.server.git.uri=https://github.com/serhatuluc/ecommerce-configmngmnt.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true

# Symmetric encryption for {cipher} values in Git. Override in production:
#   ENCRYPT_KEY=<long-random-secret>
# Encrypt:  curl -s localhost:8888/encrypt -H "Content-Type: text/plain" --data-raw "secret"
# Then store the result as: password: '{cipher}<ciphertext>'
# The server decrypts before serving config to clients.
encrypt.key=${ENCRYPT_KEY:ecommerce-config-dev-key-change-me}
spring.cloud.config.server.encrypt.enabled=true
